# Filesystem paths and external checkpoint locations.
paths:
  # Options: relative or absolute directory path; Demo v6.1 writes and clears
  # generated online chunks, capture files, and static final_data under it.
  data_process_base_path: "outputs_v6_1"
  # Options: relative or absolute pickle file path; required when table
  # calibration is used by capture/alignment helpers.
  table_calibrate_path: "table_calibrate.pkl"
  # Options: relative or absolute .pt checkpoint path; used only when
  # sam31_checkpoint_env is unset in the process environment.
  sam31_checkpoint_path: "vendor/demo_runtime/checkpoints/sam31/sam3.1_multiplex.pt"
  # Options: non-empty environment variable name; its value may override
  # sam31_checkpoint_path.
  sam31_checkpoint_env: "QQTT_SAM31_CHECKPOINT"

# Source stream and replay pacing.
input:
  # Options: fake-live | live.
  # fake-live replays prepared data as a live stream; live reads RealSense.
  input_source: "fake-live"
  # Options: data_collect case directory path; null only for live input or
  # when the CLI supplies --fake-live-case.
  fake_live_case: "data_collect/sloth_new_20260705_230611"
  # Options: positive finite float FPS; controls output metadata and chunk
  # window math.
  replay_fps: 5.0
  # Options: positive finite float FPS; baseline used to decide whether the
  # effective fake-live camera pacing should pass --lossless-input-fps.
  camera_source_replay_fps: 5.0

# Chunk publication cadence and run length.
chunking:
  # Options: positive finite float seconds; chunk_frame_count defaults to
  # round(replay_fps * chunk_seconds).
  chunk_seconds: 7.0
  # Options: positive finite float seconds; sleep between frames.jsonl polls.
  chunk_poll_interval_s: 0.001
  # Options: null or positive integer; null streams until input ends/stops.
  max_chunks: null

# Camera capture, depth, masks, and local model runtime.
camera:
  # Options: one integer from camera_fps_choices; RealSense live input FPS.
  # replay_fps still controls the output cadence.
  camera_fps: 30
  # Options: list of positive integer FPS values accepted by --camera-fps.
  camera_fps_choices: [5, 15, 30, 60]
  # Options: non-negative finite float; manual RealSense RGB exposure.
  camera_color_exposure: 45.0
  # Options: non-negative finite float; manual RealSense RGB gain.
  camera_color_gain: 45.0
  # Options: non-empty string safe for file names; prefixes generated cases.
  case_prefix: "demo_v6_1"
  # Options: native-realsense | ir-ffs.
  # native-realsense uses RealSense depth; ir-ffs uses stereo FFS depth.
  depth_backend: "native-realsense"
  # Options: finite float logit threshold; lower values grow EdgeTAM masks.
  edgetam_mask_logit_threshold: 0
  # Options: positive finite float meters; radius for mask point-cloud
  # outlier filtering.
  mask_radius_outlier_radius_m: 0.01
  # Options: positive integer; minimum neighbors for radius outlier filtering.
  mask_radius_outlier_nb_points: 40
  # Options: torch device string, usually cuda, cuda:N, or cpu.
  perception_device: "cuda"
  # Options: torch device string, usually cuda, cuda:N, or cpu.
  tracker_device: "cuda"
  # Options: bfloat16 | float16 | float32.
  inference_dtype: "bfloat16"

# GPU namespaces for the cooperating subprocesses.
gpu:
  # Options: non-empty CUDA_VISIBLE_DEVICES string, e.g. "0", "1", or "0,1".
  # Main warmup and realtime data_process stages use this namespace.
  main_data_processing_cuda_visible_devices: "0"
  # Options: non-empty CUDA_VISIBLE_DEVICES string, e.g. "0", "1", or "0,1".
  # Shape-prior SAM3D stages use this namespace.
  shape_prior_warmup_cuda_visible_devices: "1"
  # Options: non-empty CUDA_VISIBLE_DEVICES string, e.g. "0", "1", or "0,1".
  # Visualizer process uses this namespace.
  visualizer_cuda_visible_devices: "1"
  # Options: non-empty CUDA_VISIBLE_DEVICES string, e.g. "0", "1", or "0,1".
  # Phystwin_shen train/viewer subprocesses use this namespace.
  phystwin_shen_cuda_visible_devices: "1"

# SAM3D shape-prior warmup.
shape_prior:
  # Options: positive integer milliseconds; deadline for local shape-prior
  # stage profile/status updates.
  shape_prior_timeout_ms: 180000
  # Options: positive finite float seconds; max wait for surface/interior
  # prior points before chunk materialization fails.
  shape_prior_chunk_wait_timeout_s: 300.0
  # Options: non-empty semantic label string, e.g. hand or towel.
  shape_prior_controller_name: "hand"
  # Options: null or relative/absolute SAM3D checkout directory path; null
  # lets SAM3D resolution use environment/default candidates.
  shape_prior_sam3d_root: null
  # Options: null or relative/absolute SAM3D pipeline config path; null uses
  # the SAM3D default config resolution.
  shape_prior_config: null

# Downstream consumer of the online stream. Exactly one runs per session.
downstream:
  # Options: disabled | demo_visualizer | phystwin_shen.
  # demo_visualizer opens the point-cloud viewer; phystwin_shen launches
  # online training plus its HTML viewer once shape prior is ready.
  mode: "phystwin_shen"

# Phystwin_shen online training + HTML realtime viewer
# (downstream.mode: phystwin_shen). The two subprocesses launch together when
# the shape prior becomes ready (points.npz written, warmup GPU freed);
# train_online_warp.py then keeps waiting for the first committed chunk.
phystwin_shen:
  # Options: relative or absolute Phystwin_shen checkout directory containing
  # train_online_warp.py and scripts/html_realtime_viewer.py.
  repo_path: "/home/xinjie/Phystwin_shen"
  # Options: non-empty conda environment name; used by both subprocesses.
  conda_env: "demo_2_max"
  # Options: non-empty case directory name under base_path.
  # online_data points both tools at the per-frame RGB-D archive published
  # under base_path/online_data.
  case_name: "online_data"
  # Options: bind host string, usually 127.0.0.1 or 0.0.0.0.
  viewer_host: "127.0.0.1"
  # Options: integer TCP port in 1..65535. A process already occupying the
  # port is killed; if the kill fails the run fails fast.
  viewer_port: 8765
  # Options: non-negative integer camera index for RGB lookup/projection.
  viewer_cam_idx: 0
  # Options: original | surface | all.
  viewer_point_mode: "surface"
  # Options: positive integer point subsampling stride.
  viewer_point_stride: 5
  # Options: frame | online.
  # frame uses snapshot frame_indices; online resolves online_data color frames
  # through online_frame_indices.
  viewer_image_index_mode: "online"
  # Options: torch device string, usually cuda:0 or cpu. Combined with
  # gpu.phystwin_shen_cuda_visible_devices, cuda:0 maps inside that namespace.
  train_device: "cuda:0"
  # Options: positive integer rollout windows per optimization step.
  train_batch_size: 5
  # Options: positive integer frames per rollout training window.
  train_segment_len: 32
  # Options: positive integer frame hop between rollout window starts.
  train_segment_stride: 30
  # Options: positive finite float seconds between online chunk polls.
  train_poll_sec: 1.0
  # Options: positive integer count of recent windows eligible for sampling.
  train_recent_window_count: 5
  # Options: positive integer iteration interval for realtime snapshots.
  train_realtime_vis_every: 1
  # Options: true | false.
  # true exits when the online manifest reports finished.
  train_stop_when_finished: true

# Demo v6.1 point-cloud visualizer (downstream.mode: demo_visualizer).
visualizer:
  # Options: conda environment name string; empty string runs plain python.
  visualizer_conda_env: "demo_2_max"
  # Options: non-negative integer camera index displayed by the visualizer.
  visualizer_cam_idx: 0
  # Options: positive finite float seconds between visualizer refresh polls.
  visualizer_poll_sec: 0.1
  # Options: positive finite float FPS for final_data playback.
  visualizer_playback_fps: 5.2
  # Options: positive integer subsampling stride for object points.
  visualizer_object_stride: 1
  # Options: positive integer pixel radius for object points.
  visualizer_object_radius: 3
  # Options: positive integer pixel radius for controller points.
  visualizer_controller_radius: 6
  # Options: rainbow | green | object-colors.
  visualizer_object_color_mode: "rainbow"
  # Options: string enum value used for side-by-side input/output display.
  visualizer_layout_side_by_side: "side-by-side"
  # Options: string enum value used for output-only display.
  visualizer_layout_output_only: "output-only"
  # Options: list containing the exact allowed visualizer layout strings.
  visualizer_layouts: ["side-by-side", "output-only"]
  # Options: one value from visualizer_layouts.
  visualizer_layout: "side-by-side"
  # Options: rgb-overlay | sam3d-final-data.
  visualizer_render_mode: "sam3d-final-data"
