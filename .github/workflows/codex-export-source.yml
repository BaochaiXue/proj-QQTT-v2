name: codex-export-source

on:
  push:
    branches:
      - codex/f-shape-constraint

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack focused source
        run: |
          tar -czf /tmp/proj-QQTT-v2-source.tar.gz \
            .github/workflows/check.yml \
            demo_v7/service \
            demo_v7/tests \
            docs/exec-plans/active \
            pyproject.toml
      - uses: actions/upload-artifact@v4
        with:
          name: proj-QQTT-v2-source
          path: /tmp/proj-QQTT-v2-source.tar.gz
          retention-days: 1
