name: codex-export-source

on:
  push:
    branches:
      - codex/f-shape-constraint

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: tar --exclude=.git -czf /tmp/proj-QQTT-v2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: proj-QQTT-v2-source
          path: /tmp/proj-QQTT-v2-source.tar.gz
          retention-days: 1
