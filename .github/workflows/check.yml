name: check

on:
  push:
  pull_request:

jobs:
  # Repo-structure guards: pure-stdlib AST/text checks, no heavy deps.
  # These are the harness entry points that actually exist today — the old
  # `scripts/harness/check_all.py` was removed in ecf5366 and this workflow
  # kept calling it, so every run since has failed at that step.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Repo guards (no third-party deps)
        run: |
          python scripts/harness/guards/check_harness_catalog.py
          python scripts/harness/guards/check_demo_v5_no_compat_wrappers.py
          python scripts/harness/guards/check_experiment_boundaries.py
          python scripts/harness/guards/check_visual_architecture.py
          python -m scripts.harness.guards.check_scope

  # demo_v7's CPU-safe unit suite — the checks the exec plan/README quote
  # (protocol, state machine, frame-0, gaussian, backends, recorder, i18n).
  # Deps are installed so the tests RUN instead of silently importorskip-ing.
  demo-v7-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install CPU test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy numba matplotlib pytest \
            opencv-python-headless trimesh plyfile pyyaml Pillow PySide6
      - name: demo_v7 unit tests
        run: python -m pytest demo_v7/tests -q --ignore=demo_v7/tests/drive_fake_live.py
