# demo_v7-only configuration.
#
# Pipeline knobs are deliberately NOT duplicated here: every demo_v6_2
# orchestrator option (chunking, camera, shape prior, GPU namespaces,
# downstream/phystwin settings, ...) keeps its default from
# demo_v6_2/config/default.yaml via demo_v6_2.main_cli.build_parser().
# demo_v7 callers override those per run with CLI-style argv
# (OrchestratorSession(extra_v62_argv=...)); this file holds only the keys
# that exist solely because of the v7 GUI + camera-service split.

session:
  # Options: fake-live | live. Source used when neither the CLI nor the GUI
  # source-select dialog picked one.
  source: "fake-live"
  # Options: data_collect case directory path or null. null inherits the
  # demo_v6_2 default (input.fake_live_case in demo_v6_2/config/default.yaml)
  # so the recording is configured in exactly one place.
  fake_live_case: null
  # Options: template string containing "{base_path}". Directory that holds
  # control.sock and frames.sock for one run. It lives under the run output
  # dir so parallel runs with different --base-path never collide; keep the
  # expansion short because Unix socket paths are limited to ~107 bytes.
  socket_dir_template: "{base_path}/v7_sockets"
  # Options: positive finite float seconds. How long the parent process
  # retries connecting to the service sockets after spawning it. The service
  # binds its sockets before model preloads, but slow disks/first-run
  # imports can still delay the bind by tens of seconds.
  connect_timeout_s: 180.0
  # Options: positive finite float seconds between connect retries.
  connect_poll_interval_s: 0.25
  # Options: trellis2 | sam3d | none. Shape-prior generation backend used
  # when neither the CLI nor the source-select dialog picked one. trellis2
  # (default per the 2026-08-07 same-frame comparison: aligned IoU 0.905 vs
  # 0.852, candidates 2.3x closer to the observation, 2048^2 texture) swaps
  # ONLY the generate stage for microsoft/TRELLIS.2 (trellis2 conda env;
  # align/sample stay v6.2); sam3d is the unchanged v6.2 generate stage;
  # none skips the shape-prior chain entirely (observed-only tracking
  # structure, ASAP + PhysTwin downstream off).
  shape_prior_backend: "trellis2"
  # Options: true | false. Whether the shape-prior chain runs the SD x4
  # upscale stage (true, the unchanged v6.2 chain) or the crop-only
  # passthrough (false; faster warmup — generation conditions on the
  # original-resolution mask-bbox crop). Used when neither the CLI nor the
  # source-select dialog picked one.
  shape_prior_upscale: true
  # Options: triposplat | mesh_surface | none. Gaussian-splats source:
  # triposplat is the independent generative model (camera GPU, then
  # registration/self-align onto the world); mesh_surface derives splats
  # deterministically from the aligned TRELLIS.2 final_mesh.glb (face_id +
  # barycentric hard binding — requires shape_prior_backend trellis2);
  # none disables the gaussian feature. shape-prior none forces gaussian
  # none. Used when neither the CLI nor the source-select dialog picked one.
  gaussian_backend: "triposplat"
  # Options: zh | en. GUI language (简体中文 / English) preselected in the
  # source-select dialog; the dialog's own combo switches it live and the
  # accepted choice applies to the whole GUI for the run.
  language: "zh"

preview:
  # Options: mapping of frame channel -> positive finite float Hz that
  # overrides demo_v7/ipc/protocol.py CHANNEL_MAX_HZ on the service encode
  # side. An empty mapping keeps the protocol defaults. Known channels:
  # rgb, depth, overlay, composite, gaussian. Read via
  # demo_v7.orchestration.session.resolve_preview_channel_max_hz.
  channel_max_hz: {}
